name: Electricity Data Collection

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  collect-and-clean:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests pymongo python-dotenv

      - name: Collect raw electricity data
        env:
          ENERGY_API_KEY: ${{ secrets.ENERGY_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python python/collect_demand.py

      - name: Clean and store electricity data
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python python/clean_demand.py